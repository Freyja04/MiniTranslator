name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
      - name: Validate release identity
        shell: pwsh
        run: |
          $cmake = Get-Content -LiteralPath native/CMakeLists.txt -Raw
          $pin = [regex]::Match($cmake, 'SCREENTRANS_UPDATE_REPOSITORY_URL\s+"https://github\.com/([^"/]+)/([^"/]+)"')
          if (-not $pin.Success) {
            throw "Could not read the updater trust root from native/CMakeLists.txt"
          }
          $pinnedRepository = "$($pin.Groups[1].Value)/$($pin.Groups[2].Value)"
          if ($env:GITHUB_REPOSITORY -cne $pinnedRepository) {
            throw "Native updates are pinned to $pinnedRepository; refusing to publish from $env:GITHUB_REPOSITORY"
          }

          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          python release/check_version.py --expected $releaseVersion
          if ($LASTEXITCODE -ne 0) { throw "Source version does not match release tag" }

          $releaseChannel = "stable"
          $numericVersion = "$releaseVersion.0"

          "RELEASE_VERSION=$releaseVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NUMERIC_VERSION=$numericVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHANNEL=$releaseChannel" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=MiniTranslator-$releaseVersion-windows-x64.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_NAME=MiniTranslator-$releaseVersion-setup-x64.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native release
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-native.ps1
          -Configuration Release
          -Architecture x64
          -UpdateChannel $env:RELEASE_CHANNEL
          -RunSmokeTest
      - name: Validate native release binary
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\release\check_native_binary.ps1
          -Path .\build\native\Release\MiniTranslator.exe
          -ExpectedVersion $env:RELEASE_VERSION
      - name: Install locked Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=$env:INNO_SETUP_VERSION --allow-downgrade --no-progress --require-checksums -y
      - name: Compile native installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe was not installed" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DAppNumericVersion=$env:RELEASE_NUMERIC_VERSION" installer/MiniTranslator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Stage portable executable and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath build/native/Release/MiniTranslator.exe -Destination "dist/$env:PORTABLE_NAME"
          Copy-Item -LiteralPath LICENSE -Destination dist/LICENSE.txt
          Copy-Item -LiteralPath native/THIRD_PARTY_NOTICES.txt -Destination dist/THIRD_PARTY_NOTICES.txt
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$env:SETUP_NAME"
          python release/generate_manifest.py --artifact "dist/$env:SETUP_NAME" --version $env:RELEASE_VERSION --download-url $downloadUrl --channel $env:RELEASE_CHANNEL --output dist/update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed" }
      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MiniTranslator-${{ github.ref_name }}-windows-x64
          path: |
            dist/MiniTranslator-*-windows-x64.exe
            dist/MiniTranslator-*-setup-x64.exe
            dist/update-manifest.json
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: MiniTranslator-${{ github.ref_name }}-windows-x64
          path: dist
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          portable="MiniTranslator-${version}-windows-x64.exe"
          setup="MiniTranslator-${version}-setup-x64.exe"
          arguments=(
            release create "$GITHUB_REF_NAME"
            "dist/$portable" "dist/$setup" "dist/update-manifest.json"
            "dist/LICENSE.txt" "dist/THIRD_PARTY_NOTICES.txt"
            --verify-tag --generate-notes --title "MiniTranslator $GITHUB_REF_NAME"
          )
          gh "${arguments[@]}"
